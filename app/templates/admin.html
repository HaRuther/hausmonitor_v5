{% extends 'base.html' %}{% block content %}<h1>Einstellungen</h1><section class=card><h2>Grenzwerte und Referenz</h2><form method=post action=/admin/settings class=form><label>Referenzkampagne<select name=level_reference_id><option value="">Erste</option>{% for c in cs %}<option value={{c.id}} {% if s.level_reference_id==c.id|string %}selected{% endif %}>{{c.measured_at}}</option>{% endfor %}</select></label><label>Info mm<input name=level_info value={{s.level_info}}></label><label>Warnung mm<input name=level_warning value={{s.level_warning}}></label><label>Alarm mm<input name=level_alarm value={{s.level_alarm}}></label><label>Basis-URL für QR<input name=base_url value="{{s.base_url}}"></label><button>Speichern</button></form></section><section class=card><h2>Messgerät anlegen</h2><form method=post action=/admin/devices class=form><label>Name<input name=name required></label><label>Typ<input name=kind></label><label>Seriennummer<input name=serial></label><label>Kalibrierung<input type=date name=calibrated_at></label><label>Notiz<input name=notes></label><button>Anlegen</button></form><ul>{% for d in devices %}<li>{{d.name}} · {{d.kind}} · Kalibrierung {{d.calibrated_at or '–'}}</li>{% endfor %}</ul></section>{% endblock %}
