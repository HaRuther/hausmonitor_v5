{% extends 'base.html' %}{% block content %}<div class=hero><h1>Rissmonitoring</h1><p><a class=button href=/cracks/new>Neue Messstelle</a> <a class=button href=/exports/risse.csv>CSV</a></p></div><section class=card><svg id=cracksChart viewBox="0 0 900 340"></svg></section><div class=grid>{% for p in ps %}<a class="card {{p.status_class}}" href="/cracks/{{p.id}}"><h2>{{p.name}}</h2><p>{{p.crack_type}} · {{p.location}}</p><b>{{p.status}} · {{'%+.3f'|format(p.delta) if p.delta is not none else '–'}} {{p.unit}}</b></a>{% endfor %}</div>{% endblock %}{% block data %}<script>window.CRACKS={{data|tojson}}</script>{% endblock %}
