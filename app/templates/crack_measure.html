{% extends 'base.html' %}{% block content %}<section class=card><h1>Messung {{p.name}}</h1><form method=post action="/cracks/{{p.id}}/measurements" enctype=multipart/form-data class=form><label>Datum<input type=datetime-local name=measured_at value="{{now}}" required></label><label>Lufttemperatur<input type=number step=.1 name=air_temp></label><label>Messwert<input type=number step=.001 name=value required></label><label>Foto<input type=file name=file accept=image/* capture=environment></label><label>Notiz<textarea name=notes></textarea></label><button>Speichern</button></form></section>{% endblock %}
