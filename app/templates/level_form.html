{% extends 'base.html' %}{% block content %}<section class=card><h1>Neue Kampagne</h1><form method=post action=/level class=form><label>Datum<input type=datetime-local name=measured_at value="{{now}}" required></label><label>Lufttemperatur<input type=number step=.1 name=air_temp></label><label>Wand SW<input type=number step=.1 name=wall_temp_sw></label><label>Wand SO<input type=number step=.1 name=wall_temp_so></label><label>Grundwasser<input type=number step=.001 name=groundwater></label><label>Regen 14 Tage<input type=number step=.1 name=rainfall_14d></label><label>Gerät<select name=device_id><option value="">–</option>{% for d in devices %}<option value={{d.id}}>{{d.name}}</option>{% endfor %}</select></label><label>Wetter<input name=weather></label><label>Licht<input name=light_mode></label><label>Notiz<textarea name=notes></textarea></label><button>Weiter</button></form></section>{% endblock %}
